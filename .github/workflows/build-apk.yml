name: Build LocalRadio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pas d'étape "Installer le SDK Android" ici : les runners ubuntu-latest
      # embarquent déjà le SDK (platform-tools, platform 34, build-tools,
      # licences acceptées) sous /usr/local/lib/android/sdk. Gradle le trouve
      # tout seul via la variable d'environnement ANDROID_HOME.

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Le projet Android (settings.gradle.kts) n'est pas forcément à la
      # racine du dépôt. On le cherche dans tout le dépôt (sans limite de
      # profondeur cette fois) ; si on ne le trouve toujours pas, on affiche
      # l'arborescence du dépôt pour comprendre ce qui a réellement été
      # poussé sur GitHub, au lieu d'échouer à l'aveugle.
      - name: Localiser le projet Gradle
        id: locate
        run: |
          FOUND=$(find . -type d \( -name '.git' -o -name '.github' \) -prune -o \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::Impossible de trouver settings.gradle(.kts) dans le dépôt. Arborescence actuelle :"
            find . -type d \( -name '.git' -o -path '*/.git/*' \) -prune -o -print | sed 's|^\./||' | sort
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Projet Gradle trouvé dans : $DIR"
          echo "gradle_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK de debug
        working-directory: ${{ steps.locate.outputs.gradle_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: LocalRadio-debug-apk
          path: ${{ steps.locate.outputs.gradle_dir }}/app/build/outputs/apk/debug/app-debug.apk
