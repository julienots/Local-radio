name: Build LocalRadio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Pas d'étape "Installer le SDK Android" ici : les runners ubuntu-latest
      # embarquent déjà le SDK (platform-tools, platform 34, build-tools,
      # licences acceptées) sous /usr/local/lib/android/sdk. Gradle le trouve
      # tout seul via la variable d'environnement ANDROID_HOME.

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Le dépôt contient parfois le projet sous forme d'archive .zip non
      # décompressée (cas courant en poussant depuis un téléphone) au lieu
      # des fichiers extraits. On cherche settings.gradle(.kts) ; s'il est
      # introuvable, on dézippe toute archive .zip trouvée à la racine et on
      # cherche à nouveau, avant d'abandonner avec l'arborescence en clair.
      - name: Localiser le projet Gradle
        id: locate
        run: |
          find_settings() {
            find . -type d \( -name '.git' -o -name '.github' \) -prune -o \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print | head -n 1
          }

          FOUND=$(find_settings)

          if [ -z "$FOUND" ]; then
            shopt -s nullglob
            for z in *.zip; do
              echo "Archive trouvée : $z -> extraction dans extracted_project/"
              unzip -o -q "$z" -d extracted_project
            done
            FOUND=$(find_settings)
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::Impossible de trouver settings.gradle(.kts), même après extraction des .zip. Arborescence actuelle :"
            find . -type d \( -name '.git' -o -path '*/.git/*' \) -prune -o -print | sed 's|^\./||' | sort
            exit 1
          fi

          DIR=$(dirname "$FOUND")
          echo "Projet Gradle trouvé dans : $DIR"
          echo "gradle_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK de debug
        working-directory: ${{ steps.locate.outputs.gradle_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: LocalRadio-debug-apk
          path: ${{ steps.locate.outputs.gradle_dir }}/app/build/outputs/apk/debug/app-debug.apk
